 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Analista IA | Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0a0a0a; --card: #151515; --accent: #00ff88; --text: #ffffff; --text-dim: #b0b0b0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
        h1, h2, h3 { font-family: 'Bebas Neue', cursive; letter-spacing: 1px; color: var(--accent); }
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 8px; border-left: 3px solid var(--accent); text-align: center; }
        .search-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-bottom: 20px; }
        input, select, textarea { background: #222; border: 1px solid #333; color: white; padding: 12px; border-radius: 5px; outline: none; width: 100%; }
        button { background: var(--accent); color: #000; border: none; padding: 12px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; font-family: 'Bebas Neue'; }
        .analysis-output { background: var(--card); padding: 20px; border-radius: 10px; display: none; margin-bottom: 20px; border: 1px solid #333; }
        .history-item { background: #111; border: 1px solid #222; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .win { border-left: 5px solid #00ff88; }
        .loss { border-left: 5px solid #ff4444; }
        #stream-text { white-space: pre-wrap; margin-top: 15px; font-size: 0.95rem; line-height: 1.6; }
    </style>
</head>
<body>
<div style="text-align: center; margin-bottom: 25px;">
    <h1>MEU ANALISTA IA</h1>
    <p style="color: var(--text-dim)">Inteligência Esportiva para Decisões Precisas</p>
</div>
<div class="stats-bar">
    <div class="stat-card"><small>TAXA DE ACERTO</small><h2 id="win-rate">0%</h2></div>
    <div class="stat-card"><small>TOTAL GREEN</small><h2 id="total-wins">0</h2></div>
    <div class="stat-card"><small>TOTAL RED</small><h2 id="total-loss">0</h2></div>
</div>
<div class="search-grid">
    <input type="text" id="match-input" placeholder="Ex: Flamengo x Palmeiras">
    <select id="league-select">
        <option value="Brasileirão">Brasileirão</option>
        <option value="Champions League">Champions League</option>
        <option value="Premier League">Premier League</option>
        <option value="Outros">Outros</option>
    </select>
    <button onclick="iniciarAnalise()">ANALISAR</button>
</div>
<div id="loading" style="display:none; color: var(--accent); text-align: center; margin: 20px;">Processando dados em tempo real...</div>
<div id="result-display" class="analysis-output">
    <h2 id="match-title"></h2>
    <div id="stream-text"></div>
    <div style="height: 250px; margin-top: 20px;"><canvas id="probChart"></canvas></div>
</div>
<div id="history-section">
    <h3>HISTÓRICO DE ANÁLISES</h3>
    <div id="history-list"></div>
</div>
<script>
    let history = JSON.parse(localStorage.getItem('fut_history')) || [];
    let myChart;
    function updateStats() {
        const wins = history.filter(h => h.status === 'win').length;
        const losses = history.filter(h => h.status === 'loss').length;
        const total = wins + losses;
        document.getElementById('total-wins').innerText = wins;
        document.getElementById('total-loss').innerText = losses;
        document.getElementById('win-rate').innerText = total > 0 ? ((wins / total) * 100).toFixed(0) + '%' : '0%';
        renderHistory();
    }
    async function iniciarAnalise() {
        const match = document.getElementById('match-input').value;
        const league = document.getElementById('league-select').value;
        if(!match) return;
        document.getElementById('loading').style.display = 'block';
        document.getElementById('result-display').style.display = 'block';
        const streamDiv = document.getElementById('stream-text');
        streamDiv.innerText = "";
        try {
            const response = await fetch('/api/analisar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ match, league })
            });
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = "";
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                fullText += chunk;
                streamDiv.innerText = fullText;
            }
            renderChart(50, 20, 30);
            saveToHistory(match, league, fullText);
        } catch (e) { alert("Erro na conexão"); }
        finally { document.getElementById('loading').style.display = 'none'; }
    }
    function renderChart(h, d, a) {
        const ctx = document.getElementById('probChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Casa', 'Empate', 'Fora'],
                datasets: [{ data: [h, d, a], backgroundColor: ['#00ff88', '#333', '#555'], borderWidth: 0 }]
            },
            options: { maintainAspectRatio: false, plugins: { legend: { labels: { color: 'white' } } } }
        });
    }
    function saveToHistory(match, league, analysis) {
        history.unshift({ id: Date.now(), match, league, analysis, status: 'pending' });
        localStorage.setItem('fut_history', JSON.stringify(history));
        updateStats();
    }
    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = history.map(item => `
            <div class="history-item ${item.status}">
                <div><strong>${item.match}</strong> | <small>${item.league}</small></div>
                <div>
                    <button onclick="setStatus(${item.id}, 'win')">✅</button>
                    <button onclick="setStatus(${item.id}, 'loss')">❌</button>
                    <button onclick="deleteItem(${item.id})">🗑️</button>
                </div>
            </div>
        `).join('');
    }
    function setStatus(id, status) {
        const idx = history.findIndex(h => h.id === id);
        history[idx].status = status;
        localStorage.setItem('fut_history', JSON.stringify(history));
        updateStats();
    }
    function deleteItem(id) {
        history = history.filter(h => h.id !== id);
        localStorage.setItem('fut_history', JSON.stringify(history));
        updateStats();
    }
    updateStats();
</script>
</body>
</html>
