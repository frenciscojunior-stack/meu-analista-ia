 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Análise Pré-Jogo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#00ff88;--green-dark:#00cc6a;--bg:#0a0a0a;--card:#141414;--border:#222;--text:#e8e8e8;--muted:#666}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding:24px 16px 48px}
.menu-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;margin-bottom:28px}
.menu-btn span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.8rem,10vw,4rem);line-height:1;letter-spacing:1px;margin-bottom:8px}
h1 span{color:var(--green)}
.subtitle{color:var(--muted);font-size:.85rem;margin-bottom:32px}
.subtitle span{margin:0 6px;opacity:.4}
input[type="text"]{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'Inter',sans-serif;font-size:1rem;padding:16px 20px;outline:none;transition:border-color .2s;margin-bottom:12px}
input[type="text"]:focus{border-color:var(--green)}
input[type="text"]::placeholder{color:var(--muted)}
button.analisar{width:100%;background:var(--green);color:#000;border:none;border-radius:12px;font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;padding:16px;cursor:pointer;transition:background .2s;margin-bottom:20px}
button.analisar:hover{background:var(--green-dark)}
button.analisar:disabled{background:#1a3a2a;color:#2a6a4a;cursor:not-allowed}
.exemplos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:32px}
.exemplos-label{color:var(--muted);font-size:.8rem}
.chip{background:transparent;border:1px solid var(--border);border-radius:999px;color:var(--text);font-size:.8rem;padding:6px 14px;cursor:pointer}
.chip:hover{border-color:var(--green);color:var(--green)}
#resultado{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;font-size:.9rem;line-height:1.7;display:none;white-space:pre-wrap;word-break:break-word}
#resultado.erro{border-color:#5a1a1a;background:#1a0a0a;color:#ff6b6b}
#resultado.visivel{display:block}
.loader{display:none;text-align:center;padding:24px 0;color:var(--muted);font-size:.85rem}
.loader.visivel{display:block}
.dot{display:inline-block;animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
#resultado strong{color:var(--green);font-weight:600}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:10}
.overlay.aberto{display:block}
.sidebar{position:fixed;top:0;left:-320px;width:300px;height:100%;background:#111;border-right:1px solid var(--border);z-index:11;transition:left .3s;overflow-y:auto;padding:24px 16px}
.sidebar.aberta{left:0}
.sidebar h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--green);margin-bottom:8px}
.acertos-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:24px;text-align:center}
.acertos-box .numero{font-size:2.5rem;font-weight:700;color:var(--green)}
.acertos-box .label{color:var(--muted);font-size:.8rem}
.historico-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}
.historico-item .jogo-nome{font-weight:600;font-size:.9rem;margin-bottom:8px;color:var(--green)}
.historico-item .resultado-label{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.btn-resultado{border:none;border-radius:6px;padding:4px 10px;font-size:.75rem;cursor:pointer;margin-right:6px;margin-top:4px}
.btn-acertou{background:#1a4a2a;color:#00ff88}
.btn-errou{background:#4a1a1a;color:#ff6b6b}
.btn-acertou.ativo{background:#00ff88;color:#000}
.btn-errou.ativo{background:#ff6b6b;color:#000}
.fechar-sidebar{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 16px;cursor:pointer;margin-bottom:20px;width:100%}
.sem-historico{color:var(--muted);font-size:.85rem;text-align:center;padding:20px 0}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="fecharMenu()"></div>
<div class="sidebar" id="sidebar">
  <button class="fechar-sidebar" onclick="fecharMenu()">✕ Fechar</button>
  <h2>📊 Histórico</h2>
  <div class="acertos-box">
    <div class="numero" id="pct-acertos">0%</div>
    <div class="label">Taxa de acertos</div>
    <div style="color:var(--muted);font-size:.75rem;margin-top:4px" id="total-analises">0 análises registradas</div>
  </div>
  <div id="lista-historico"><div class="sem-historico">Nenhuma análise ainda.<br>Faça sua primeira análise!</div></div>
</div>

<div class="menu-btn" onclick="abrirMenu()"><span></span><span></span><span></span></div>
<h1>ANÁLISE <span>PRÉ-JOGO</span></h1>
<p class="subtitle">IA com busca em tempo real<span>·</span>Dados reais<span>·</span>Análise profissional</p>
<input type="text" id="jogo" placeholder="Ex: Flamengo x Palmeiras"/>
<button class="analisar" id="btn" onclick="analisar()">ANALISAR</button>
<div class="exemplos">
<span class="exemplos-label">Exemplos:</span>
<span class="chip" onclick="preencher('Fla x Pal')">Fla x Pal</span>
<span class="chip" onclick="preencher('El Clásico')">El Clásico</span>
<span class="chip" onclick="preencher('City x Arsenal')">City x Arsenal</span>
<span class="chip" onclick="preencher('Majestoso')">Majestoso</span>
</div>
<div class="loader" id="loader">Buscando dados em tempo real<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
<div id="resultado"></div>

<script>
let historico = JSON.parse(localStorage.getItem('historico')||'[]');
function salvarHistorico(){localStorage.setItem('historico',JSON.stringify(historico));}

function abrirMenu(){
  document.getElementById('sidebar').classList.add('aberta');
  document.getElementById('overlay').classList.add('aberto');
  renderHistorico();
}
function fecharMenu(){
  document.getElementById('sidebar').classList.remove('aberta');
  document.getElementById('overlay').classList.remove('aberto');
}

function renderHistorico(){
  const lista=document.getElementById('lista-historico');
  const pct=document.getElementById('pct-acertos');
  const total=document.getElementById('total-analises');
  const comResultado=historico.filter(h=>h.resultado);
  const acertos=historico.filter(h=>h.resultado==='acertou').length;
  const pctVal=comResultado.length>0?Math.round((acertos/comResultado.length)*100):0;
  pct.textContent=pctVal+'%';
  total.textContent=historico.length+' análises registradas';
  if(historico.length===0){lista.innerHTML='<div class="sem-historico">Nenhuma análise ainda.<br>Faça sua primeira análise!</div>';return;}
  lista.innerHTML=historico.slice().reverse().map((h,i)=>{
    const idx=historico.length-1-i;
    return `<div class="historico-item">
      <div class="jogo-nome">⚽ ${h.jogo}</div>
      <div class="resultado-label">Resultado:</div>
      <button class="btn-resultado btn-acertou ${h.resultado==='acertou'?'ativo':''}" onclick="marcarResultado(${idx},'acertou')">✅ Acertou</button>
      <button class="btn-resultado btn-errou ${h.resultado==='errou'?'ativo':''}" onclick="marcarResultado(${idx},'errou')">❌ Errou</button>
    </div>`;
  }).join('');
}

function marcarResultado(idx,res){
  historico[idx].resultado=historico[idx].resultado===res?null:res;
  salvarHistorico();
  renderHistorico();
}

function preencher(t){document.getElementById('jogo').value=t;}

async function analisar(){
  const jogo=document.getElementById('jogo').value.trim();
  const resultado=document.getElementById('resultado');
  const loader=document.getElementById('loader');
  const btn=document.getElementById('btn');
  if(!jogo){resultado.className='visivel erro';resultado.innerHTML='⚠️ Digite o nome do jogo.';return;}
  btn.disabled=true;
  resultado.className='visivel';
  resultado.innerHTML='';
  loader.className='visivel';

  try{
    const r=await fetch('/api/analisar',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({jogo})
    });

    const reader=r.body.getReader();
    const decoder=new TextDecoder();
    let textoCompleto='';
    let jogoSalvo=false;

    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      const chunk=decoder.decode(value);
      const lines=chunk.split('\n');
      for(const line of lines){
        if(line.startsWith('data: ')){
          const data=line.slice(6);
          if(data==='[DONE]'){
            loader.className='';
            if(!jogoSalvo && textoCompleto){
              historico.push({jogo,data:new Date().toLocaleDateString('pt-BR'),resultado:null});
              salvarHistorico();
              jogoSalvo=true;
            }
            continue;
          }
          try{
            const parsed=JSON.parse(data);
            if(parsed.texto){
              textoCompleto+=parsed.texto;
              resultado.innerHTML=textoCompleto.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
            }
            if(parsed.erro){
              resultado.className='visivel erro';
              resultado.innerHTML='⚠️ '+parsed.erro;
              loader.className='';
            }
          }catch{}
        }
      }
    }
  }catch(e){
    resultado.className='visivel erro';
    resultado.innerHTML='⚠️ '+(e.message||'Erro ao buscar análise.');
    loader.className='';
  }finally{
    btn.disabled=false;
  }
}
document.getElementById('jogo').addEventListener('keydown',e=>{if(e.key==='Enter')analisar();});
</script>
</body>
</html>
