<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Analista IA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #ffffff; }
        .neon-border { border: 1px solid #00ff88; box-shadow: 0 0 10px #00ff8833; }
        .bg-card { background-color: #121212; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-black text-[#00ff88] mb-2">MEU ANALISTA IA</h1>
            <p class="text-gray-400">Inteligência Esportiva para Decisões Precisas</p>
        </header>

        <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="bg-card p-4 rounded-xl neon-border text-center">
                <p class="text-xs text-gray-400 uppercase">Taxa de Acerto</p>
                <p class="text-2xl font-bold" id="winRate">0%</p>
            </div>
            <div class="bg-card p-4 rounded-xl border border-gray-800 text-center">
                <p class="text-xs text-gray-400 uppercase">Total Green</p>
                <p class="text-2xl font-bold text-[#00ff88]" id="totalGreen">0</p>
            </div>
            <div class="bg-card p-4 rounded-xl border border-gray-800 text-center">
                <p class="text-xs text-gray-400 uppercase">Total Red</p>
                <p class="text-2xl font-bold text-red-500" id="totalRed">0</p>
            </div>
        </div>

        <div class="flex gap-2 mb-6">
            <input type="text" id="matchInput" placeholder="Ex: Liverpool x Chelsea" class="flex-1 bg-card border border-gray-800 p-4 rounded-xl focus:outline-none focus:border-[#00ff88]">
            <select id="leagueSelect" class="bg-card border border-gray-800 p-4 rounded-xl">
                <option value="Brasileirão">Brasileirão</option>
                <option value="Premier League">Premier League</option>
                <option value="Champions League">Champions League</option>
            </select>
            <button onclick="analisarJogo()" id="btnAnalisar" class="bg-[#00ff88] text-black font-bold px-6 rounded-xl hover:bg-[#00cc6e] transition-all">ANALISAR</button>
        </div>

        <div id="resultadoArea" class="hidden bg-card p-6 rounded-2xl border border-gray-800 mb-8">
            <div id="loading" class="hidden text-center p-8">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#00ff88] mx-auto mb-4"></div>
                <p>Processando dados em tempo real...</p>
            </div>
            
            <div id="analiseTexto" class="prose prose-invert max-w-none mb-6 text-gray-300"></div>
            
            <div class="max-w-[300px] mx-auto">
                <canvas id="probChart"></canvas>
            </div>
        </div>

        <h3 class="text-[#00ff88] font-bold mb-4 uppercase tracking-widest text-sm">Histórico de Análises</h3>
        <div id="historico" class="space-y-3"></div>
    </div>

    <script>
        let myChart = null;

        async function analisarJogo() {
            const match = document.getElementById('matchInput').value;
            const league = document.getElementById('leagueSelect').value;
            const btn = document.getElementById('btnAnalisar');
            const textoArea = document.getElementById('analiseTexto');
            
            if(!match) return alert("Digite o nome do jogo!");

            document.getElementById('resultadoArea').classList.remove('hidden');
            document.getElementById('loading').classList.remove('hidden');
            textoArea.innerHTML = "";
            btn.disabled = true;

            try {
                const response = await fetch('/api/analisar', {
                    method: 'POST',
                    body: JSON.stringify({ match, league })
                });

                if (!response.ok) throw new Error('Erro na resposta do servidor');

                document.getElementById('loading').classList.add('hidden');
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    textoArea.innerHTML += decoder.decode(value);
                }

                atualizarGrafico();
            } catch (error) {
                textoArea.innerHTML = `<p class="text-red-500">Erro: ${error.message}</p>`;
            } finally {
                btn.disabled = false;
            }
        }

        function atualizarGrafico() {
            const ctx = document.getElementById('probChart').getContext('2d');
            if(myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Casa', 'Empate', 'Fora'],
                    datasets: [{
                        data: [45, 25, 30],
                        backgroundColor: ['#00ff88', '#333', '#666'],
                        borderWidth: 0
                    }]
                },
                options: { plugins: { legend: { labels: { color: '#fff' } } } }
            });
        }
    </script>
</body>
</html>
